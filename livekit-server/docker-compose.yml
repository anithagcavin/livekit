version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881" 
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml
    environment:
      - LIVEKIT_KEYS=APIyourkey: yoursecret
    networks:
      - livekit-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - livekit-net

networks:
  livekit-net:
    driver: bridge